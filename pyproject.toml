[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-thermo-printer"
version = "0.1.0"
description = "Remote receipt printing for Epson ESC/POS thermal printers over WebSockets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "remote-thermo-printer" }]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Install on the machine that hosts the backend:  pip install ".[server]"
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.1",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
]
# Install on the Raspberry Pi that drives the printer:  pip install ".[client]"
client = [
    "websockets>=12.0",
    "python-escpos>=3.0",
    "pillow>=10.0",
    "pymupdf>=1.23",
    "pydantic-settings>=2.1",
]
# Everything, for local development and the smoke test:  pip install ".[dev]"
dev = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "python-escpos>=3.0",
    "pillow>=10.0",
    "pymupdf>=1.23",
    "pydantic-settings>=2.1",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
]

[project.scripts]
rtp-server = "server.__main__:main"
rtp-client = "client.__main__:main"

[tool.setuptools]
packages = ["common", "server", "client"]

[tool.setuptools.package-data]
server = ["static/*"]
